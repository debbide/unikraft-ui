services:
  unikraft-ui:
    image: ghcr.io/debbide/unikraft-ui:latest
    container_name: my-unikraft-ui
    restart: unless-stopped
    environment:
      NODE_ENV: production
      UNIKRAFT_SSH_PRIVATE_KEY_PATH: /run/secrets/unikraft_ssh_key
      UNIKRAFT_SSH_HOST_FINGERPRINTS: ${UNIKRAFT_SSH_HOST_FINGERPRINTS:-}
    ports:
      - "127.0.0.1:18689:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets/unikraft_ssh_key:/run/secrets/unikraft_ssh_key:ro
