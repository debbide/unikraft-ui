services:
  unikraft-ui:
    image: ghcr.io/debbide/unikraft-ui:latest
    container_name: my-unikraft-ui
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      KRAFTKIT_NO_WARN_CLOUD_DEPRECATION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
